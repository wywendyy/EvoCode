[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evocode"
version = "0.1.0"
description = "A small coding agent for learning the agent loop"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.25.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
evocode = "evocode.cli:main"

[tool.setuptools.packages.find]
include = ["evocode*"]
